
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="google-site-verification" content="k0YyLpk9uZbhM109juWUrSG2qF3sC_J9T978HxmDvc4" />
<title>TSY TAXI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

.splash-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    animation: pageFade 0.5s ease;
}

.logo {
    width: min(88vw, 650px);
    max-height: 65vh;
    object-fit: contain;
    animation: logoAnimation 0.8s ease both;
}

.loading {
    margin-top: 22px;
    width: 32px;
    height: 32px;
    border: 4px solid #eeeeee;
    border-top: 4px solid #ffc400;
    border-right: 4px solid #171717;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

.loading-text {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #777777;
    animation: pulse 0.8s ease-in-out infinite alternate;
}

.footer {
    position: absolute;
    bottom: 18px;
    width: 100%;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: #888888;
}

.footer span {
    color: #d69b00;
    font-weight: bold;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes logoAnimation {
    0% {
        opacity: 0;
        transform: scale(0.75) translateY(20px);
    }
    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes pulse {
    from { opacity: 0.4; }
    to { opacity: 1; }
}

@keyframes pageFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

</style>
</head>

<body>

<div class="splash-screen">

    <!-- TSY TAXI LOGO -->
    <img
        src="tsy-logo.jpeg"
        alt="TSY TAXI Logo"
        class="logo"
    >

    <!-- ANIMATED LOADING CIRCLE -->
    <div class="loading"></div>

    <div class="loading-text">LOADING...</div>

    <!-- COPYRIGHT -->
    <div class="footer">
        © 2026 <span>TSY TAXI</span>. All Rights Reserved.
    </div>

</div>

<script>
    // Automatically open login page after 1 second
   window.addEventListener("load", function () {
    setTimeout(function () {
        window.location.replace("login.html");
    }, 3500);
});
</script>

</body>
</html>
