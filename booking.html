<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffc400">
<title>Confirm Booking | TSY TAXI</title>
<style>
:root{--yellow:#ffc400;--ink:#111;--muted:#777;--line:#e9e9e9;--green:#16834a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
body{min-height:100svh;background:radial-gradient(circle at 50% 0,#fff4c4 0,#fff 42%,#f4f4f2 100%);display:flex;flex-direction:column}

.topbar{min-height:68px;background:#111;color:#fff;border-bottom:4px solid var(--yellow);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,5vw,60px)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand img{width:43px;height:43px;border-radius:50%;object-fit:contain;background:#fff;padding:2px}
.brand strong{display:block;font-size:18px;font-weight:950;letter-spacing:1.3px;line-height:1.05}
.brand small{display:block;color:var(--yellow);font-size:9px;letter-spacing:2px;font-weight:800;margin-top:4px}
.safe{font-size:9px;letter-spacing:.8px;color:#222;background:#ffdf66;border-radius:30px;padding:8px 11px;font-weight:900;white-space:nowrap}

main{flex:1;padding:14px 16px;max-width:600px;width:100%;margin:0 auto;overflow-y:auto}

.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:16px;box-shadow:0 8px 30px #00000010;margin-bottom:10px}

.page-title{font-size:20px;font-weight:950;letter-spacing:-0.5px;margin-bottom:4px;text-align:center}
.page-sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px;line-height:1.4}

.trip-summary{background:linear-gradient(135deg,#fff8d9 0%,#fffdf3 100%);border:1px solid #f2df9c;border-radius:14px;padding:12px;margin-bottom:14px}
.trip-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.trip-row:last-child{margin-bottom:0}
.trip-icon{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.trip-icon.pickup{background:#eaf8ef;color:#16834a;font-weight:900}
.trip-icon.drop{background:#fff0ed;color:#e34c38;font-weight:900}
.trip-details{flex:1;min-width:0}
.trip-label{font-size:9px;color:#806000;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.trip-location{font-size:13px;font-weight:800;color:#111;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fare-banner{background:#111;color:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.fare-auto-img{width:80px;height:80px;object-fit:contain;flex-shrink:0}
.fare-content{flex:1;text-align:left}
.fare-label{font-size:10px;color:#ffc400;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.fare-amount{font-size:28px;font-weight:950;letter-spacing:-1px;margin:4px 0;color:#fff}
.fare-breakdown{font-size:10px;color:#aaa;margin-top:2px}

.form-section{margin-bottom:14px}
.section-title{font-size:11px;font-weight:900;color:#111;margin-bottom:10px;letter-spacing:0.5px;text-transform:uppercase}

.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:900;margin-bottom:6px;color:#333}
.field label span{color:#e34c38}
.input-shell{display:flex;align-items:center;gap:8px;border:1.5px solid #e3e3e3;border-radius:11px;padding:0 12px;height:44px;background:#fff;transition:all 0.2s}
.input-shell:focus-within{border-color:#d8a000;box-shadow:0 0 0 3px #ffc40024}
.field-icon{font-size:16px;color:#888;flex-shrink:0}
.input-shell input,.input-shell textarea{border:0;outline:0;width:100%;font-size:13px;color:#111;background:transparent;font-family:inherit}
.input-shell input::placeholder,.input-shell textarea::placeholder{color:#a2a2a2}

.textarea-shell{display:flex;gap:8px;border:1.5px solid #e3e3e3;border-radius:11px;padding:12px;background:#fff;transition:all 0.2s}
.textarea-shell:focus-within{border-color:#d8a000;box-shadow:0 0 0 3px #ffc40024}
.textarea-shell textarea{border:0;outline:0;width:100%;min-height:70px;font-size:13px;color:#111;background:transparent;resize:vertical;font-family:inherit}

.btn-primary{width:100%;height:44px;border:0;border-radius:12px;background:var(--yellow);color:#111;font-size:13px;font-weight:950;letter-spacing:0.4px;cursor:pointer;box-shadow:0 3px 0 #d19e00;transition:transform 0.1s;margin-bottom:8px}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #d19e00}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}

.btn-back{width:100%;height:38px;border:1px solid #e3e3e3;border-radius:11px;background:#fff;color:#666;font-size:11px;font-weight:800;cursor:pointer;margin-bottom:8px}
.btn-back:hover{background:#f9f9f9}

.error{background:#fff0ed;color:#a6382c;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:16px;line-height:1.4;display:none}
.error.show{display:block}

.success{background:#eaf8ef;color:#176534;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:16px;line-height:1.4;display:none}
.success.show{display:block}

@media(max-width:600px){
  .topbar{min-height:56px;padding:0 12px}
  .brand img{width:34px;height:34px}
  .brand strong{font-size:14px}
  .brand small{font-size:7px;letter-spacing:1.4px}
  .safe{font-size:7px;padding:6px 7px}
  main{padding:12px 10px}
  .card{padding:14px;border-radius:16px}
  .page-title{font-size:18px}
  .page-sub{font-size:10px}
  .trip-summary{padding:10px}
  .trip-icon{width:28px;height:28px;font-size:14px}
  .trip-location{font-size:12px}
  .trip-label{font-size:8px}
  .fare-auto-img{width:70px;height:70px}
  .fare-amount{font-size:24px}
  .fare-label{font-size:9px}
  .fare-breakdown{font-size:9px}
  .input-shell{height:40px;padding:0 10px}
  .field-icon{font-size:14px}
  .btn-primary{height:40px;font-size:12px}
  .btn-back{height:36px;font-size:10px}
}
</style>
</head>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwd7gY4QG96MKI-At38eXMVF-pQQU0F-s",
  authDomain: "tsytaxi-fcbd3.firebaseapp.com",
  projectId: "tsytaxi-fcbd3",
  storageBucket: "tsytaxi-fcbd3.firebasestorage.app",
  messagingSenderId: "160017935162",
  appId: "1:160017935162:web:3574d6e57febf56c5bfe03",
  measurementId: "G-NLQ0MNH4XE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Set API_URL to Node.js server
window.API_URL = "http://localhost:3000";

// Check if user is logged in, create guest if not
let currentUser = JSON.parse(localStorage.getItem("tsyTaxiUser") || "{}");
if (!currentUser.name || !currentUser.uid) {
  const guestId = "guest_" + Date.now();
  currentUser = { uid: guestId, name: "Guest User", phone: "", email: "", isGuest: true };
  localStorage.setItem("tsyTaxiUser", JSON.stringify(currentUser));
}

// Load user data from Firestore
async function loadUserFromFirestore() {
  if (!currentUser.uid || currentUser.isGuest) return currentUser;

  try {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      const firestoreData = userDoc.data();
      const updatedUser = {
        ...currentUser,
        name: firestoreData.name || currentUser.name,
        email: firestoreData.email || currentUser.email,
        phone: firestoreData.phone || currentUser.phone,
        address: firestoreData.address || ""
      };
      localStorage.setItem("tsyTaxiUser", JSON.stringify(updatedUser));
      console.log("✓ User data loaded from Firestore");
      return updatedUser;
    }
  } catch (error) {
    console.error("Firestore load error:", error);
  }
  return currentUser;
}

window.currentUser = await loadUserFromFirestore();
window.firestoreDB = db;
</script>

<header class="topbar">
  <div class="brand" onclick="window.location.href='home.html'">
    <img src="logo.jpeg" alt="TSY Taxi logo">
    <div><strong>TSY TAXI</strong><small>YOUR RIDE. YOUR WAY.</small></div>
  </div>
  <div class="safe">● SAFE & RELIABLE</div>
</header>

<main>
  <div class="card">
    <div id="errorBox" class="error"></div>
    <div id="successBox" class="success"></div>

    <div class="form-section">
      <div class="section-title">Passenger Details</div>

      <div class="field">
        <label>Full Name <span>*</span></label>
        <div class="input-shell">
          <span class="field-icon">👤</span>
          <input type="text" id="passengerName" placeholder="Enter your full name" autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <label>Phone Number <span>*</span></label>
        <div class="input-shell">
          <span class="field-icon">📱</span>
          <input type="tel" id="phoneNumber" placeholder="10-digit mobile number" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" required>
        </div>
      </div>

      <div class="field" id="emailField">
        <label>Email Address <span>*</span></label>
        <div class="input-shell">
          <span class="field-icon">📧</span>
          <input type="email" id="emailAddress" placeholder="your.email@example.com" autocomplete="email" required>
        </div>
      </div>

      <!-- Coupon Field -->
      <div class="field" id="couponField">
        <label>Coupon Code <span style="font-weight:400;color:#999">(Optional)</span></label>
        <div class="input-shell">
          <span class="field-icon">🎟️</span>
          <input type="text" id="couponCode" placeholder="Enter coupon code" style="text-transform:uppercase">
          <button id="applyCoupon" style="border:0;border-radius:8px;background:#16834a;color:#fff;font-size:11px;font-weight:900;padding:8px 12px;cursor:pointer;white-space:nowrap">APPLY</button>
          <button id="removeCoupon" style="display:none;border:0;border-radius:8px;background:#e34c38;color:#fff;font-size:11px;font-weight:900;padding:8px 12px;cursor:pointer;white-space:nowrap;margin-left:6px">REMOVE</button>
        </div>
        <div id="couponMessage" style="font-size:11px;margin-top:6px;display:none"></div>
        <div id="availableCoupons" style="margin-top:10px;display:none"></div>
      </div>
    </div>

    <h1 class="page-title">Confirm Your Booking</h1>
    <p class="page-sub">Review trip details and enter your information to complete the booking</p>

    <div class="trip-summary">
      <div class="trip-row">
        <div class="trip-icon pickup">🟢</div>
        <div class="trip-details">
          <div class="trip-label">Pickup Location</div>
          <div class="trip-location" id="pickupDisplay">Loading...</div>
        </div>
      </div>
      <div class="trip-row">
        <div class="trip-icon drop">🔴</div>
        <div class="trip-details">
          <div class="trip-label">Destination</div>
          <div class="trip-location" id="destinationDisplay">Loading...</div>
        </div>
      </div>
    </div>

    <div class="fare-banner">
      <img src="auto.jpeg" alt="Auto" class="fare-auto-img">
      <div class="fare-content">
        <div class="fare-label">Total Estimated Fare</div>
        <div class="fare-amount" id="fareDisplay">₹0.00</div>

    <button class="btn-primary" id="confirmBtn" type="button">CONFIRM BOOKING</button>
    <button class="btn-back" onclick="window.location.href='home.html'">← BACK TO HOME</button>

</main>

<script>
"use strict";

// Get booking data from sessionStorage
const bookingData = JSON.parse(sessionStorage.getItem("tsyTaxiBooking") || "{}");

// Elements
const pickupDisplay = document.getElementById("pickupDisplay");
const destinationDisplay = document.getElementById("destinationDisplay");
const fareDisplay = document.getElementById("fareDisplay");
const fareBreakdown = document.getElementById("fareBreakdown");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");
const confirmBtn = document.getElementById("confirmBtn");

// Form fields
const passengerName = document.getElementById("passengerName");
const phoneNumber = document.getElementById("phoneNumber");
const emailAddress = document.getElementById("emailAddress");

// Coupon elements
const couponCode = document.getElementById("couponCode");
const applyCoupon = document.getElementById("applyCoupon");
const removeCoupon = document.getElementById("removeCoupon");
const couponMessage = document.getElementById("couponMessage");
const availableCoupons = document.getElementById("availableCoupons");

// Coupon state
let activeCoupon = null;
let originalFare = bookingData.fare || 0;
let discountAmount = 0;

// Load and display available coupons
async function loadAvailableCoupons() {
  try {
    const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const {getFirestore, collection, query, where, getDocs} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

    const bookingsConfig = {
      apiKey: "AIzaSyBwd7gY4QG96MKI-At38eXMVF-pQQU0F-s",
      authDomain: "tsytaxi-fcbd3.firebaseapp.com",
      projectId: "tsytaxi-fcbd3"
    };

    const bookingsApp = initializeApp(bookingsConfig, "couponsApp");
    const db = getFirestore(bookingsApp);

    const couponsRef = collection(db, "coupons");
    const now = new Date();
    const userId = window.currentUser?.uid || '';

    // Query active coupons
    const q = query(couponsRef, where("active", "==", true));
    const snapshot = await getDocs(q);

    const validCoupons = snapshot.docs.filter(doc => {
      const coupon = doc.data();
      const validFrom = coupon.validFrom?.toDate() || new Date(0);
      const validTo = coupon.validTo?.toDate() || new Date('2099-12-31');
      const isValid = now >= validFrom && now <= validTo;
      const hasUsage = coupon.usedCount < coupon.usageLimit;
      const isAssigned = coupon.assignedTo === "all" || (coupon.assignedTo && coupon.assignedTo.includes(userId));
      return isValid && hasUsage && isAssigned;
    });

    if (validCoupons.length > 0) {
      availableCoupons.style.display = "block";
      availableCoupons.innerHTML = `
        <div style="font-size:11px;font-weight:900;color:#666;margin-bottom:8px">AVAILABLE COUPONS</div>
        ${validCoupons.map(doc => {
          const coupon = doc.data();
          return `
            <div style="background:#fff7df;border:1px dashed #d19e00;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer"
                 onclick="document.getElementById('couponCode').value='${coupon.code}';document.getElementById('applyCoupon').click();">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="font-size:13px;font-weight:900;color:#111">${coupon.code}</div>
                  <div style="font-size:10px;color:#666;margin-top:2px">${coupon.discount}% OFF</div>
                </div>
                <div style="font-size:10px;font-weight:900;color:#16834a">APPLY →</div>
              </div>
            </div>
          `;
        }).join('')}
      `;
    }
  } catch (error) {
    console.error("Error loading coupons:", error);
  }
}

// Apply coupon
applyCoupon.addEventListener("click", async () => {
  const code = couponCode.value.trim().toUpperCase();
  if (!code) {
    showCouponMessage("Please enter a coupon code", "error");
    return;
  }

  applyCoupon.disabled = true;
  applyCoupon.textContent = "CHECKING...";

  try {
    const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
    const {getFirestore, collection, query, where, getDocs} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

    const bookingsConfig = {
      apiKey: "AIzaSyBwd7gY4QG96MKI-At38eXMVF-pQQU0F-s",
      authDomain: "tsytaxi-fcbd3.firebaseapp.com",
      projectId: "tsytaxi-fcbd3"
    };

    const bookingsApp = initializeApp(bookingsConfig, "couponApp");
    const db = getFirestore(bookingsApp);

    const couponsRef = collection(db, "coupons");
    const q = query(couponsRef, where("code", "==", code), where("active", "==", true));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
      showCouponMessage("Invalid or expired coupon code", "error");
      return;
    }

    const couponDoc = snapshot.docs[0];
    const coupon = couponDoc.data();
    const now = new Date();
    const validFrom = coupon.validFrom?.toDate() || new Date(0);
    const validTo = coupon.validTo?.toDate() || new Date('2099-12-31');

    // Validate coupon
    if (now < validFrom) {
      showCouponMessage("Coupon not valid yet", "error");
      return;
    }
    if (now > validTo) {
      showCouponMessage("Coupon has expired", "error");
      return;
    }
    if (coupon.usedCount >= coupon.usageLimit) {
      showCouponMessage("Coupon usage limit reached", "error");
      return;
    }

    const userId = window.currentUser?.uid || '';
    if (coupon.assignedTo !== "all" && (!coupon.assignedTo || !coupon.assignedTo.includes(userId))) {
      showCouponMessage("This coupon is not assigned to you", "error");
      return;
    }

    // Apply discount
    activeCoupon = {id: couponDoc.id, ...coupon};
    discountAmount = (originalFare * coupon.discount) / 100;
    const newFare = originalFare - discountAmount;

    bookingData.fare = newFare;
    bookingData.couponId = couponDoc.id;
    bookingData.couponCode = coupon.code;
    bookingData.discount = discountAmount;
    bookingData.originalFare = originalFare;

    fareDisplay.textContent = "₹" + newFare.toFixed(2);
    fareBreakdown.innerHTML = `
      <div style="text-decoration:line-through;color:#999">₹${originalFare.toFixed(2)}</div>
      <div style="color:#16834a;font-weight:900">-₹${discountAmount.toFixed(2)} (${coupon.discount}% OFF)</div>
    `;

    showCouponMessage(`Coupon applied! You saved ₹${discountAmount.toFixed(2)}`, "success");
    couponCode.disabled = true;
    applyCoupon.style.display = "none";
    removeCoupon.style.display = "inline-block";

  } catch (error) {
    console.error("Coupon error:", error);
    showCouponMessage("Error applying coupon", "error");
  } finally {
    applyCoupon.disabled = false;
    if (applyCoupon.textContent === "CHECKING...") {
      applyCoupon.textContent = "APPLY";
    }
  }
});

// Remove coupon
removeCoupon.addEventListener("click", () => {
  // Reset fare to original
  bookingData.fare = originalFare;
  delete bookingData.couponId;
  delete bookingData.couponCode;
  delete bookingData.discount;
  delete bookingData.originalFare;

  // Reset UI
  fareDisplay.textContent = "₹" + originalFare.toFixed(2);
  fareBreakdown.textContent = `${bookingData.distanceKm.toFixed(2)} km × ₹${bookingData.ratePerKm}/km · ${bookingData.estimatedDuration}`;

  // Clear coupon state
  activeCoupon = null;
  discountAmount = 0;

  // Reset form
  couponCode.value = "";
  couponCode.disabled = false;
  applyCoupon.style.display = "inline-block";
  removeCoupon.style.display = "none";

  // Clear message
  couponMessage.style.display = "none";

  // Show available coupons again
  loadAvailableCoupons();
});

function showCouponMessage(msg, type) {
  couponMessage.textContent = msg;
  couponMessage.style.display = "block";
  couponMessage.style.color = type === "success" ? "#16834a" : "#e34c38";
  couponMessage.style.fontWeight = "700";
}

// Load saved profile from Firestore
async function loadSavedProfile() {
  // Wait for module script to load currentUser
  while (!window.currentUser || !window.firestoreDB) {
    await new Promise(resolve => setTimeout(resolve, 100));
  }

  const userData = window.currentUser;
  const emailField = document.getElementById("emailField");

  // Auto-fill if user has profile data (from Firestore or localStorage)
  if (userData.name) {
    passengerName.value = userData.name || "";
    phoneNumber.value = userData.phone || "";
    emailAddress.value = userData.email || "";

    // Show email field
    emailField.style.display = "block";

    console.log("✓ Profile auto-filled from Firestore:", userData.name);
  } else {
    // No profile - show empty fields
    emailField.style.display = "block";
    passengerName.value = "";
    phoneNumber.value = "";
    emailAddress.value = "";
    console.log("ℹ No saved profile - new customer");
  }
}

// Load profile and coupons on page load
window.addEventListener('load', () => {
  loadSavedProfile();
  loadAvailableCoupons();
});

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.add("show");
  successBox.classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showSuccess(message) {
  successBox.textContent = message;
  successBox.classList.add("show");
  errorBox.classList.remove("show");
}

// Load booking data
if (!bookingData.pickup || !bookingData.destination || !bookingData.fare) {
  pickupDisplay.textContent = "No booking data";
  destinationDisplay.textContent = "Please start from home page";
  fareDisplay.textContent = "₹0.00";
  fareBreakdown.textContent = "No trip selected";
  confirmBtn.disabled = true;
  showError("⚠️ No booking data found. Please go back to home page and select your pickup and destination.");
} else {
  // Display trip details
  pickupDisplay.textContent = bookingData.pickup.displayName || bookingData.pickup.area || "Selected location";
  destinationDisplay.textContent = bookingData.destination.displayName || bookingData.destination.area || "Selected location";
  fareDisplay.textContent = "₹" + bookingData.fare.toFixed(2);
  fareBreakdown.textContent = `${bookingData.distanceKm.toFixed(2)} km × ₹${bookingData.ratePerKm}/km · ${bookingData.estimatedDuration}`;
}

// Phone number validation
phoneNumber.addEventListener("input", function() {
  this.value = this.value.replace(/[^0-9]/g, "");
});

// Confirm booking
confirmBtn.addEventListener("click", async function() {
  errorBox.classList.remove("show");
  successBox.classList.remove("show");

  // Validation
  const name = passengerName.value.trim();
  const phone = phoneNumber.value.trim();
  const email = emailAddress.value.trim();

  if (!name) {
    showError("Please enter your full name");
    passengerName.focus();
    return;
  }

  if (name.length < 3) {
    showError("Name must be at least 3 characters");
    passengerName.focus();
    return;
  }

  if (!phone) {
    showError("Please enter your phone number");
    phoneNumber.focus();
    return;
  }

  if (phone.length !== 10) {
    showError("Phone number must be exactly 10 digits");
    phoneNumber.focus();
    return;
  }

  // Validate email only if email field is visible
  const emailField = document.getElementById("emailField");
  if (emailField.style.display !== "none") {
    if (!email) {
      showError("Please enter your email address");
      emailAddress.focus();
      return;
    }

    if (!email.includes("@") || !email.includes(".")) {
      showError("Please enter a valid email address");
      emailAddress.focus();
      return;
    }
  }

  // Create booking object
  const booking = {
    ...bookingData,
    passenger: {
      name: name,
      phone: phone,
      email: email
    }
  };

  confirmBtn.disabled = true;
  confirmBtn.textContent = "CONFIRMING...";

  try {
    // Generate booking ID
    const bookingId = "TSY" + Date.now();

    // Save booking to Firestore with PENDING status
    if (window.currentUser && window.currentUser.uid && window.firestoreDB) {
      const {collection, addDoc, doc, setDoc, onSnapshot} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

      // Save/update customer data in users collection
      const userRef = doc(window.firestoreDB, "users", window.currentUser.uid);
      await setDoc(userRef, {
        name: name,
        phone: phone,
        email: email,
        userId: window.currentUser.uid,
        lastBookingAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      }, { merge: true });
      console.log("✓ Customer data saved to Firestore");

      // Save booking
      const bookingsRef = collection(window.firestoreDB, "bookings");
      const docRef = await addDoc(bookingsRef, {
        ...booking,
        bookingId: bookingId,
        userId: window.currentUser.uid,
        createdAt: new Date().toISOString(),
        status: "PENDING"
      });
      console.log("✓ Booking saved to Firestore:", bookingId, "Doc ID:", docRef.id);

      // Save coupon usage if coupon was applied
      if (activeCoupon) {
        try {
          const {serverTimestamp, updateDoc, increment} = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");
          const couponUsageRef = collection(window.firestoreDB, "couponUsage");
          await addDoc(couponUsageRef, {
            couponId: activeCoupon.id,
            couponCode: activeCoupon.code,
            userId: window.currentUser.uid,
            bookingId: bookingId,
            discountAmount: discountAmount,
            usedAt: serverTimestamp()
          });

          // Increment coupon used count
          const couponRef = doc(window.firestoreDB, "coupons", activeCoupon.id);
          await updateDoc(couponRef, {
            usedCount: increment(1)
          });
          console.log("✓ Coupon usage tracked");
        } catch (error) {
          console.error("Coupon tracking error:", error);
        }
      }

      // Update user data in localStorage
      const updatedUser = {
        ...window.currentUser,
        name: name,
        phone: phone,
        email: email
      };
      localStorage.setItem("tsyTaxiUser", JSON.stringify(updatedUser));

      // Clear session data
      sessionStorage.removeItem("tsyTaxiBooking");

      // Redirect to booking status page
      window.location.href = `booking-status.html?id=${docRef.id}`;

      // Listen for admin confirmation
      const unsubscribe = onSnapshot(doc(window.firestoreDB, "bookings", docRef.id), (doc) => {
        if (doc.exists()) {
          const data = doc.data();
          if (data.status === "CONFIRMED") {
            clearInterval(countdownInterval);
            unsubscribe();

            successBox.innerHTML = `
              <div style="text-align:center">
                <div style="font-size:48px;color:#16834a;margin:20px 0">✓</div>
                <div style="font-size:18px;font-weight:900;color:#16834a">Booking Confirmed!</div>
                <div style="font-size:13px;color:#666;margin-top:8px">Booking ID: ${bookingId}</div>
                <div style="font-size:13px;color:#666;margin-top:4px">Fare: ₹${booking.fare.toFixed(2)}</div>
              </div>
            `;

            setTimeout(() => {
              alert("Booking Confirmed!\n\nBooking ID: " + bookingId + "\nFare: ₹" + booking.fare.toFixed(2) + "\n\nOur driver will contact you shortly at " + phone);
              window.location.href = "home.html";
            }, 2000);
          } else if (data.status === "REJECTED") {
            clearInterval(countdownInterval);
            unsubscribe();
            showError("Booking was rejected by admin. Please try again.");
            confirmBtn.style.display = "block";
            confirmBtn.disabled = false;
            confirmBtn.textContent = "TRY AGAIN";
          }
        }
      });

    } else {
      throw new Error("User not authenticated");
    }

  } catch (error) {
    console.error("Save error:", error);
    showError("Booking failed: " + error.message);
    confirmBtn.disabled = false;
    confirmBtn.textContent = "CONFIRM BOOKING";
  }
});
</script>
</body>
</html>
